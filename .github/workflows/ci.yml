name: aerotvc validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numpy-only:
    runs-on: ubuntu-latest
    env:
      AEROTVC_DISABLE_JAX: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify frozen source and test hashes
        run: sha256sum -c FROZEN_HASHES.txt
      - run: python -m pip install ".[test]"
      - name: Verify NumPy fallback without JAX installed
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('jax') is None"
          python run_tests.py
  jax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify frozen source and test hashes
        run: sha256sum -c FROZEN_HASHES.txt
      - run: python -m pip install ".[test,jax]"
      - name: Verify float64 JAX backend
        run: |
          python -c "from aerotvc.ad import BACKEND; assert BACKEND == 'jax'"
          python run_tests.py
