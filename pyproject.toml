[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotvc"
version = "0.1.0"
description = "Idealized nozzle, thrust-vector dynamics, and convex edge-flow models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[project.optional-dependencies]
jax = ["jax==0.6.2"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["aerotvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
